<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mirando a Cuenca</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Elemento de Vídeo para la Cámara Trasera -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Modal de Permisos / Inicio -->
  <div id="permission-modal">
    <div class="modal-card">
      <div class="icon-cuenca">📍</div>
      <h1>Mirando a Cuenca</h1>
      <p>Coloca el móvil plano sobre la mano para la brújula, o levántalo frente a ti para buscar Cuenca con la cámara.</p>
      <button class="btn-primary" id="start-btn">
        <span>Comenzar experiencia</span>
      </button>
    </div>
  </div>

  <div id="app-container">
    
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="badge-status">
        <div class="dot" id="target-dot"></div>
        <span id="target-status-label">Buscando...</span>
      </div>

      <button class="btn-icon" id="toggle-reticle-btn">
        <span id="reticle-mode-label">⭕ Círculo</span>
      </button>
    </div>

    <!-- 1. MODO BRÚJULA (PLANO EN LA MANO) -->
    <div id="compass-mode">
      <div class="compass-container">
        <div class="compass-bezel"></div>

        <div class="compass-dial" id="compass-dial">
          <div class="dial-mark north">N</div>
          <div class="dial-mark east">E</div>
          <div class="dial-mark south">S</div>
          <div class="dial-mark west">O</div>
        </div>

        <div class="cuenca-needle" id="cuenca-needle">
          <div class="needle-shape">
            <div class="needle-cuenca-head" id="needle-head"></div>
            <div class="needle-tail"></div>
            <div class="needle-center-pin"></div>
          </div>
        </div>
      </div>

      <div class="info-labels">
        <div class="target-city">Cuenca</div>
        <div class="target-distance" id="distance-label">Calculando coordenadas GPS...</div>
      </div>
    </div>

    <!-- 2. MODO CÁMARA (VERTICAL AL FRENTE) -->
    <div id="ar-mode">
      <div class="ar-compass-bar">
        <span>📍 Cuenca: <strong id="ar-diff-angle">0°</strong></span>
      </div>

      <div class="ar-reticle-container">
        <!-- Retículo A: Círculo tradicional -->
        <div class="target-circle" id="circle-reticle" style="display: none;"></div>

        <!-- Retículo B: Casas Colgadas SVG oficial -->
        <div class="target-casas-container" id="casas-reticle"></div>

        <div class="ar-status-text" id="ar-guidance-text">Gira hacia Cuenca</div>
      </div>

      <div style="height: 30px;"></div>
    </div>

    <!-- Barra Inferior de Diagnóstico y Calibración Rápida -->
    <div class="bottom-info">
      <div>Rumbo Móvil: <span id="debug-heading">--°</span></div>
      <div>Rumbo Cuenca: <span id="debug-cuenca">--°</span></div>
      <div>Desvío: <span id="debug-diff">--°</span></div>
      <button class="btn-flip" id="btn-toggle-invert" title="Invierte 180° si tu sensor lee la dirección contraria">Invertir 180°</button>
    </div>

  </div>

  <script>
    // Coordenadas oficiales de las Casas Colgadas de Cuenca
    const CUENCA_LAT = 40.07833;
    const CUENCA_LON = -2.12889;

    let userLat = null;
    let userLon = null;
    let bearingToCuenca = 0;
    let distanceKm = 0;

    let currentHeading = 0;
    let isVertical = false;
    let reticleMode = 'casas';
    let invertOffset = (localStorage.getItem('cuenca_invert_180') === 'true') ? 180 : 0;

    const TOLERANCE_DEG = 9;

    // Elementos DOM
    const modal = document.getElementById('permission-modal');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('camera-video');
    const compassMode = document.getElementById('compass-mode');
    const arMode = document.getElementById('ar-mode');
    const compassDial = document.getElementById('compass-dial');
    const cuencaNeedle = document.getElementById('cuenca-needle');
    const needleHead = document.getElementById('needle-head');
    const distanceLabel = document.getElementById('distance-label');
    const targetDot = document.getElementById('target-dot');
    const targetStatusLabel = document.getElementById('target-status-label');
    const toggleReticleBtn = document.getElementById('toggle-reticle-btn');
    const reticleModeLabel = document.getElementById('reticle-mode-label');
    const circleReticle = document.getElementById('circle-reticle');
    const casasReticle = document.getElementById('casas-reticle');
    const arDiffAngle = document.getElementById('ar-diff-angle');
    const arGuidanceText = document.getElementById('ar-guidance-text');
    const debugHeading = document.getElementById('debug-heading');
    const debugCuenca = document.getElementById('debug-cuenca');
    const debugDiff = document.getElementById('debug-diff');
    const btnToggleInvert = document.getElementById('btn-toggle-invert');

    if (invertOffset === 180) {
      btnToggleInvert.style.background = 'rgba(59, 130, 246, 0.4)';
    }

    btnToggleInvert.addEventListener('click', () => {
      invertOffset = (invertOffset === 0) ? 180 : 0;
      localStorage.setItem('cuenca_invert_180', (invertOffset === 180).toString());
      btnToggleInvert.style.background = invertOffset === 180 ? 'rgba(59, 130, 246, 0.4)' : 'rgba(255, 255, 255, 0.1)';
      actualizarBrujulaYVisor();
    });

    // FÓRMULA DE RUMBO DIRECTO (Ortodrómica / Gran Círculo)
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);

      return (θ * 180 / Math.PI + 360) % 360;
    }

    // DISTANCIA HAVERSINE
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // CÁMARA TRASERA
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.play();
      } catch (err) {
        console.warn("Cámara no disponible:", err);
      }
    }

    // ORIENTACIÓN Y SENSORES
    function handleOrientation(e) {
      let rawHeading = null;

      // iOS Safari
      if (typeof e.webkitCompassHeading !== "undefined" && e.webkitCompassHeading !== null) {
        rawHeading = e.webkitCompassHeading;
      } 
      // Android / W3C
      else if (e.alpha !== null) {
        rawHeading = (360 - e.alpha) % 360;
      }

      if (rawHeading === null) return;

      currentHeading = (rawHeading + invertOffset) % 360;

      const beta = Math.abs(e.beta || 0);
      const wasVertical = isVertical;
      isVertical = beta > 45;

      if (isVertical !== wasVertical) {
        if (isVertical) {
          compassMode.style.display = "none";
          arMode.style.display = "flex";
          video.style.display = "block";
        } else {
          arMode.style.display = "none";
          compassMode.style.display = "flex";
          video.style.display = "none";
        }
      }

      actualizarBrujulaYVisor();
    }

    function actualizarBrujulaYVisor() {
      // 1. Roseta cardinal
      compassDial.style.transform = `rotate(${-currentHeading}deg)`;

      // 2. Aguja a Cuenca
      const needleAngle = (bearingToCuenca - currentHeading + 360) % 360;
      cuencaNeedle.style.transform = `rotate(${needleAngle}deg)`;

      // 3. Desvío relativo normalizado (-180° a +180°)
      let diff = ((bearingToCuenca - currentHeading + 540) % 360) - 180;
      const isLookingAtCuenca = Math.abs(diff) <= TOLERANCE_DEG;

      arDiffAngle.textContent = `${Math.abs(Math.round(diff))}° ${diff > 0 ? 'a la derecha ➡️' : '⬅️ a la izquierda'}`;

      if (isLookingAtCuenca) {
        circleReticle.classList.add('on-target');
        casasReticle.classList.add('on-target');
        needleHead.style.borderBottomColor = "#10b981";
        targetDot.classList.add('active');
        targetStatusLabel.textContent = "¡Mirando a Cuenca!";
        arGuidanceText.textContent = "🎯 ¡Estás mirando a Cuenca!";
      } else {
        circleReticle.classList.remove('on-target');
        casasReticle.classList.remove('on-target');
        needleHead.style.borderBottomColor = "#ef4444";
        targetDot.classList.remove('active');
        targetStatusLabel.textContent = "Buscando Cuenca";
        arGuidanceText.textContent = diff > 0 ? "Gira a la derecha ➡️" : "⬅️ Gira a la izquierda";
      }

      debugHeading.textContent = `${Math.round(currentHeading)}°`;
      debugCuenca.textContent = `${Math.round(bearingToCuenca)}°`;
      debugDiff.textContent = `${Math.round(diff)}°`;
    }

    // GPS
    function initGPS() {
      if (!navigator.geolocation) {
        alert("Geolocalización no soportada.");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;

          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);

          distanceLabel.textContent = `A ${Math.round(distanceKm)} km en línea recta`;
          actualizarBrujulaYVisor();
        },
        (err) => {
          console.warn("Aviso GPS:", err);
          userLat = 40.4168;
          userLon = -3.7038;
          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceLabel.textContent = `Aprox. ${Math.round(distanceKm)} km (Modo estimado)`;
          actualizarBrujulaYVisor();
        },
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    }

    // ARRANQUE Y PERMISOS
    startBtn.addEventListener('click', async () => {
      initGPS();
      await startCamera();

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            alert('Permiso denegado para el sensor de orientación.');
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }

      modal.style.display = 'none';
    });

    // ALTERNAR VISOR ENTRE CASAS COLGADAS Y CÍRCULO
    toggleReticleBtn.addEventListener('click', () => {
      if (reticleMode === 'casas') {
        reticleMode = 'circle';
        casasReticle.style.display = 'none';
        circleReticle.style.display = 'block';
        reticleModeLabel.textContent = "🏛️ Casas Colgadas";
      } else {
        reticleMode = 'casas';
        circleReticle.style.display = 'none';
        casasReticle.style.display = 'block';
        reticleModeLabel.textContent = "⭕ Círculo";
      }
    });
  </script>
</body>
</html>
