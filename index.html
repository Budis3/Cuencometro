<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mirando a Cuenca</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.88);
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* VÍDEO DE CÁMARA A PANTALLA COMPLETA */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* PANTALLA DE PERMISOS E INICIO */
    #permission-modal {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.2rem 1.6rem;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .icon-cuenca {
      font-size: 3rem;
      margin-bottom: 0.8rem;
    }

    .modal-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 1.8rem;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* CONTENEDOR DE LA INTERFAZ */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    /* BARRA SUPERIOR */
    .top-bar {
      pointer-events: auto;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.8rem;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--danger);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .dot.active {
      background: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .top-controls {
      display: flex;
      gap: 0.5rem;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 0.45rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-icon:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* 1. MODO BRÚJULA (PLANO EN LA MANO) */
    #compass-mode {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      transition: opacity 0.3s;
    }

    .compass-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-bezel {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: radial-gradient(circle, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.85) 100%);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.5);
    }

    .compass-dial {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.08s linear;
    }

    .dial-mark {
      position: absolute;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .dial-mark.north {
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--danger);
      font-size: 1.15rem;
    }

    .dial-mark.east {
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
    }

    .dial-mark.south {
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
    }

    .dial-mark.west {
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
    }

    /* Aguja Cuenca */
    .cuenca-needle {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.08s linear;
    }

    .needle-shape {
      width: 6px;
      height: 210px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .needle-cuenca-head {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 90px solid #ef4444;
      transition: border-bottom-color 0.2s;
    }

    .needle-tail {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 70px solid rgba(255, 255, 255, 0.2);
    }

    .needle-center-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      border: 3px solid #1e293b;
      z-index: 10;
    }

    .info-labels {
      margin-top: 2rem;
      text-align: center;
    }

    .target-city {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
    }

    .target-distance {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* 2. MODO CÁMARA (VERTICAL AL FRENTE) */
    #ar-mode {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      position: relative;
    }

    .ar-compass-bar {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 1.3rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .ar-reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .target-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--danger);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .target-circle.on-target {
      border-color: var(--success);
      box-shadow: 0 0 32px rgba(16, 185, 129, 0.9);
    }

    .target-casas-svg {
      width: 180px;
      height: 180px;
      fill: none;
      stroke: var(--danger);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
      transition: stroke 0.15s, filter 0.15s;
    }

    .target-casas-svg.on-target {
      stroke: var(--success);
      filter: drop-shadow(0 0 14px rgba(16, 185, 129, 0.95));
    }

    .ar-status-text {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.65);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* BARRA INFERIOR DE DIAGNÓSTICO */
    .bottom-info {
      pointer-events: auto;
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.7);
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(0, 0, 0, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-flip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Vídeo para la Cámara Trasera en Modo Vertical -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Modal de Solicitud de Permisos -->
  <div id="permission-modal">
    <div class="modal-card">
      <div class="icon-cuenca">📍</div>
      <h1>Mirando a Cuenca</h1>
      <p>Coloca el móvil plano sobre la mano para la brújula, o levántalo frente a ti para buscar Cuenca con la cámara.</p>
      <button class="btn-primary" id="start-btn">
        <span>Comenzar experiencia</span>
      </button>
    </div>
  </div>

  <div id="app-container">
    
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="badge-status">
        <div class="dot" id="target-dot"></div>
        <span id="target-status-label">Buscando...</span>
      </div>

      <div class="top-controls">
        <button class="btn-icon" id="toggle-reticle-btn">
          <span id="reticle-mode-label">🏛️ Casas Colgadas</span>
        </button>
      </div>
    </div>

    <!-- 1. MODO BRÚJULA (PLANO EN LA MANO) -->
    <div id="compass-mode">
      <div class="compass-container">
        <div class="compass-bezel"></div>

        <div class="compass-dial" id="compass-dial">
          <div class="dial-mark north">N</div>
          <div class="dial-mark east">E</div>
          <div class="dial-mark south">S</div>
          <div class="dial-mark west">O</div>
        </div>

        <div class="cuenca-needle" id="cuenca-needle">
          <div class="needle-shape">
            <div class="needle-cuenca-head" id="needle-head"></div>
            <div class="needle-tail"></div>
            <div class="needle-center-pin"></div>
          </div>
        </div>
      </div>

      <div class="info-labels">
        <div class="target-city">Cuenca</div>
        <div class="target-distance" id="distance-label">Calculando coordenadas GPS...</div>
      </div>
    </div>

    <!-- 2. MODO AR / CÁMARA (VERTICAL) -->
    <div id="ar-mode">
      <div class="ar-compass-bar">
        <span>📍 Cuenca: <strong id="ar-diff-angle">0°</strong></span>
      </div>

      <div class="ar-reticle-container">
        <!-- Retículo Círculo -->
        <div class="target-circle" id="circle-reticle"></div>

        <!-- Retículo SVG Casas Colgadas -->
        <svg class="target-casas-svg" id="casas-reticle" viewBox="0 0 100 100" style="display: none;">
          <path d="M 5,95 Q 30,85 45,65 T 75,55 L 95,50" />
          <path d="M 45,65 L 45,95" />
          <path d="M 60,60 L 60,95" />
          <rect x="42" y="28" width="22" height="30" />
          <polygon points="40,28 53,18 66,28" />
          <rect x="37" y="38" width="5" height="12" />
          <line x1="37" y1="50" x2="42" y2="50" />
          <line x1="37" y1="44" x2="37" y2="48" />
          <rect x="36" y="52" width="6" height="8" />
          <line x1="48" y1="36" x2="52" y2="36" />
          <line x1="56" y1="36" x2="60" y2="36" />
          <line x1="48" y1="46" x2="52" y2="46" />
          <line x1="56" y1="46" x2="60" y2="46" />
        </svg>

        <div class="ar-status-text" id="ar-guidance-text">Gira hacia Cuenca</div>
      </div>

      <div style="height: 30px;"></div>
    </div>

    <!-- Barra Inferior de Diagnóstico y Calibración Rápida -->
    <div class="bottom-info">
      <div>Rumbo Móvil: <span id="debug-heading">--°</span></div>
      <div>Rumbo Cuenca: <span id="debug-cuenca">--°</span></div>
      <div>Desvío: <span id="debug-diff">--°</span></div>
      <button class="btn-flip" id="btn-toggle-invert" title="Invierte 180° si tu sensor lee la dirección contraria">Invertir 180°</button>
    </div>

  </div>

  <script>
    // Coordenadas oficiales de las Casas Colgadas de Cuenca
    const CUENCA_LAT = 40.07833;
    const CUENCA_LON = -2.12889;

    let userLat = null;
    let userLon = null;
    let bearingToCuenca = 0;
    let distanceKm = 0;

    let currentHeading = 0;
    let isVertical = false;
    let reticleMode = 'circle';
    let invertOffset = (localStorage.getItem('cuenca_invert_180') === 'true') ? 180 : 0;

    const TOLERANCE_DEG = 9;

    // Elementos DOM
    const modal = document.getElementById('permission-modal');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('camera-video');
    const compassMode = document.getElementById('compass-mode');
    const arMode = document.getElementById('ar-mode');
    const compassDial = document.getElementById('compass-dial');
    const cuencaNeedle = document.getElementById('cuenca-needle');
    const needleHead = document.getElementById('needle-head');
    const distanceLabel = document.getElementById('distance-label');
    const targetDot = document.getElementById('target-dot');
    const targetStatusLabel = document.getElementById('target-status-label');
    const toggleReticleBtn = document.getElementById('toggle-reticle-btn');
    const reticleModeLabel = document.getElementById('reticle-mode-label');
    const circleReticle = document.getElementById('circle-reticle');
    const casasReticle = document.getElementById('casas-reticle');
    const arDiffAngle = document.getElementById('ar-diff-angle');
    const arGuidanceText = document.getElementById('ar-guidance-text');
    const debugHeading = document.getElementById('debug-heading');
    const debugCuenca = document.getElementById('debug-cuenca');
    const debugDiff = document.getElementById('debug-diff');
    const btnToggleInvert = document.getElementById('btn-toggle-invert');

    if (invertOffset === 180) {
      btnToggleInvert.style.background = 'rgba(59, 130, 246, 0.4)';
    }

    btnToggleInvert.addEventListener('click', () => {
      invertOffset = (invertOffset === 0) ? 180 : 0;
      localStorage.setItem('cuenca_invert_180', (invertOffset === 180).toString());
      btnToggleInvert.style.background = invertOffset === 180 ? 'rgba(59, 130, 246, 0.4)' : 'rgba(255, 255, 255, 0.1)';
      actualizarBrujulaYVisor();
    });

    // FÓRMULA DE RUMBO DIRECTO (Ortodrómica / Gran Círculo)
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);

      return (θ * 180 / Math.PI + 360) % 360;
    }

    // DISTANCIA HAVERSINE
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // CÁMARA TRASERA
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.play();
      } catch (err) {
        console.warn("Cámara no disponible:", err);
      }
    }

    // ORIENTACIÓN Y SENSORES
    function handleOrientation(e) {
      let rawHeading = null;

      // iOS Safari (webkitCompassHeading proporciona el norte magnético horario directo)
      if (typeof e.webkitCompassHeading !== "undefined" && e.webkitCompassHeading !== null) {
        rawHeading = e.webkitCompassHeading;
      } 
      // Android / Estándar W3C (alpha es antihorario, se normaliza a sentido horario)
      else if (e.alpha !== null) {
        rawHeading = (360 - e.alpha) % 360;
      }

      if (rawHeading === null) return;

      // Aplicar compensación opcional de 180° si el hardware lee en polo invertido
      currentHeading = (rawHeading + invertOffset) % 360;

      // Detección de postura: plano sobre mano (beta < 45) vs vertical (beta > 45)
      const beta = Math.abs(e.beta || 0);
      const wasVertical = isVertical;
      isVertical = beta > 45;

      if (isVertical !== wasVertical) {
        if (isVertical) {
          compassMode.style.display = "none";
          arMode.style.display = "flex";
          video.style.display = "block";
        } else {
          arMode.style.display = "none";
          compassMode.style.display = "flex";
          video.style.display = "none";
        }
      }

      actualizarBrujulaYVisor();
    }

    function actualizarBrujulaYVisor() {
      // 1. Roseta cardinal: gira -currentHeading para que la N mire siempre al Norte físico
      compassDial.style.transform = `rotate(${-currentHeading}deg)`;

      // 2. Aguja a Cuenca: rota la diferencia angular exacta (Rumbo Cuenca - Rumbo Móvil)
      const needleAngle = (bearingToCuenca - currentHeading + 360) % 360;
      cuencaNeedle.style.transform = `rotate(${needleAngle}deg)`;

      // 3. Desvío relativo centrado entre -180° y +180°
      let diff = ((bearingToCuenca - currentHeading + 540) % 360) - 180;
      const isLookingAtCuenca = Math.abs(diff) <= TOLERANCE_DEG;

      arDiffAngle.textContent = `${Math.abs(Math.round(diff))}° ${diff > 0 ? 'a la derecha ➡️' : '⬅️ a la izquierda'}`;

      if (isLookingAtCuenca) {
        circleReticle.classList.add('on-target');
        casasReticle.classList.add('on-target');
        needleHead.style.borderBottomColor = "#10b981";
        targetDot.classList.add('active');
        targetStatusLabel.textContent = "¡Mirando a Cuenca!";
        arGuidanceText.textContent = "🎯 ¡Estás mirando a Cuenca!";
      } else {
        circleReticle.classList.remove('on-target');
        casasReticle.classList.remove('on-target');
        needleHead.style.borderBottomColor = "#ef4444";
        targetDot.classList.remove('active');
        targetStatusLabel.textContent = "Buscando Cuenca";
        arGuidanceText.textContent = diff > 0 ? "Gira a la derecha ➡️" : "⬅️ Gira a la izquierda";
      }

      debugHeading.textContent = `${Math.round(currentHeading)}°`;
      debugCuenca.textContent = `${Math.round(bearingToCuenca)}°`;
      debugDiff.textContent = `${Math.round(diff)}°`;
    }

    // GPS
    function initGPS() {
      if (!navigator.geolocation) {
        alert("Geolocalización no soportada en este navegador.");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;

          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);

          distanceLabel.textContent = `A ${Math.round(distanceKm)} km en línea recta`;
          actualizarBrujulaYVisor();
        },
        (err) => {
          console.warn("Aviso GPS:", err);
          // Coordenadas fallback (Madrid) si no hay GPS activo
          userLat = 40.4168;
          userLon = -3.7038;
          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceLabel.textContent = `Aprox. ${Math.round(distanceKm)} km (Modo estimado)`;
          actualizarBrujulaYVisor();
        },
        { enableHighAccuracy: true, maximumAge: 5000 }
      );
    }

    // BOTÓN DE ARRANQUE Y PERMISOS
    startBtn.addEventListener('click', async () => {
      initGPS();
      await startCamera();

      // iOS 13+ requiere pedir permiso explícito
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            alert('Permiso denegado para el sensor de orientación.');
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        // En Android escuchamos el sensor absoluto si existe
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }

      modal.style.display = 'none';
    });

    // ALTERNAR RETÍCULO
    toggleReticleBtn.addEventListener('click', () => {
      if (reticleMode === 'circle') {
        reticleMode = 'casas';
        circleReticle.style.display = 'none';
        casasReticle.style.display = 'block';
        reticleModeLabel.textContent = "⭕ Círculo";
      } else {
        reticleMode = 'circle';
        casasReticle.style.display = 'none';
        circleReticle.style.display = 'block';
        reticleModeLabel.textContent = "🏛️ Casas Colgadas";
      }
    });
  </script>
</body>
</html>
