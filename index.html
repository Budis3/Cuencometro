<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mirando a Cuenca</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* PANTALLA DE INICIO / PERMISOS */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: radial-gradient(circle at center, #1e2238 0%, #0d0f18 100%);
    }

    .btn-main {
      background: #00ff66;
      color: #05140b;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px 28px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
      margin-top: 24px;
      transition: transform 0.15s ease;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    /* CÁMARA (FONDO COMPLETO) */
    #camera-video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* CAPA DE INTERFAZ AR */
    #ar-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
    }

    /* BARRA SUPERIOR AR */
    .ar-top-bar {
      width: 100%;
      max-width: 380px;
      background: rgba(13, 15, 24, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    .ar-direction-hint {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .ar-tape-container {
      width: 100%;
      height: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
    }

    .ar-tape-indicator {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #00ff66;
      transform: translateX(-50%);
      z-index: 2;
    }

    .ar-tape-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      font-weight: bold;
      color: #ff2244;
      transition: left 0.1s linear, color 0.2s ease;
    }

    /* RETÍCULA CENTRAL */
    .reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reticle-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #ff2244;
      box-shadow: 0 0 15px rgba(255, 34, 68, 0.5);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .target-active {
      border-color: #00ff66 !important;
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.8) !important;
    }

    /* MODO PLANO (BRÚJULA EN PALMA) */
    #compass-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .compass-dial {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .compass-needle {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transition: transform 0.1s linear;
      transform-origin: 50% 50%;
    }

    /* BOTONES DE CONTROL SUPERIOR */
    .top-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }

    .btn-toggle {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 12px;
      font-size: 0.75rem;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- PANTALLA INICIAL -->
  <div id="start-screen">
    <h1 style="font-size: 2rem; margin-bottom: 8px;">Mirando a Cuenca</h1>
    <p style="color: #aaa; max-width: 300px; font-size: 0.95rem;">
      Descubre la dirección exacta a las Casas Colgadas de Cuenca con tu brújula y cámara.
    </p>
    <button class="btn-main" id="btn-start">Iniciar Sensores</button>
  </div>

  <!-- CÁMARA (MODO VERTICAL) -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- CAPA MODO VERTICAL / AR -->
  <div id="ar-layer">
    <div class="ar-top-bar">
      <div class="ar-direction-hint" id="ar-hint">Buscando Cuenca...</div>
      <div class="ar-tape-container">
        <div class="ar-tape-indicator"></div>
        <div class="ar-tape-marker" id="tape-marker">CUENCA</div>
      </div>
    </div>

    <!-- RETÍCULA CIRCULAR -->
    <div class="reticle-container">
      <div id="reticle" class="reticle-circle"></div>
    </div>

    <div style="font-size: 0.85rem; color: #ccc; text-align: center; margin-bottom: 10px;" id="dist-text-ar">
      Calculando distancia...
    </div>
  </div>

  <!-- CAPA MODO PLANO (BRÚJULA EN PALMA) -->
  <div id="compass-layer">
    <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 16px;">
      Móvil plano sobre la mano
    </div>

    <div class="compass-dial">
      <svg class="compass-needle" id="needle-svg" viewBox="0 0 200 200">
        <!-- Aguja que apunta hacia Cuenca -->
        <polygon points="100,20 112,100 88,100" fill="#00ff66" />
        <polygon points="100,180 112,100 88,100" fill="#555" />
        <circle cx="100" cy="100" r="8" fill="#fff" />
        <text x="100" y="15" fill="#00ff66" font-size="12" font-weight="bold" text-anchor="middle">CUENCA</text>
      </svg>
    </div>

    <div id="dist-text-compass" style="color: #aaa; font-size: 0.95rem;">
      Esperando GPS...
    </div>
  </div>

  <!-- BOTÓN DE INVERTIR RUTA SI TU MÓVIL LEE EL EJE CONTRARIO -->
  <div class="top-controls">
    <button class="btn-toggle" id="btn-invert">Invertir 180° (Activar/Desactivar)</button>
  </div>

  <script>
    // Coordenadas oficiales de las Casas Colgadas de Cuenca
    const CUENCA_LAT = 40.0783;
    const CUENCA_LNG = -2.1287;

    let userLat = null;
    let userLng = null;
    let targetBearing = 0; // Rumbo directo hacia Cuenca
    let invertHeading = false; // Alternador por si algún terminal lo lee invertido

    // Elementos DOM
    const startScreen = document.getElementById('start-screen');
    const btnStart = document.getElementById('btn-start');
    const cameraVideo = document.getElementById('camera-video');
    const arLayer = document.getElementById('ar-layer');
    const compassLayer = document.getElementById('compass-layer');
    const reticle = document.getElementById('reticle');
    const needleSvg = document.getElementById('needle-svg');
    const arHint = document.getElementById('ar-hint');
    const tapeMarker = document.getElementById('tape-marker');
    const distTextAr = document.getElementById('dist-text-ar');
    const distTextCompass = document.getElementById('dist-text-compass');
    const btnInvert = document.getElementById('btn-invert');

    btnInvert.addEventListener('click', () => {
      invertHeading = !invertHeading;
      btnInvert.style.borderColor = invertHeading ? '#00ff66' : 'rgba(255,255,255,0.3)';
    });

    // 1. INICIAR SENSORES TRAS GESTO DE USUARIO (REQUISITO IOS/ANDROID)
    btnStart.addEventListener('click', async () => {
      startScreen.style.display = 'none';

      // Solicitar GPS
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updatePosition, handleGeoError, {
          enableHighAccuracy: true,
          maximumAge: 1000
        });
      }

      // Solicitar Cámara
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        cameraVideo.srcObject = stream;
      } catch (err) {
        console.warn("No se pudo iniciar la cámara:", err);
      }

      // Permiso de orientación para iOS 13+
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const resp = await DeviceOrientationEvent.requestPermission();
          if (resp === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        // En Android, escuchar evento absoluto para brújula magnética real
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation);
        } else {
          window.addEventListener('deviceorientation', handleOrientation);
        }
      }
    });

    // 2. CÁLCULO DE RUMBO (BEARING) Y DISTANCIA
    function toRad(deg) { return deg * (Math.PI / 180); }
    function toDeg(rad) { return rad * (180 / Math.PI); }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const phi1 = toRad(lat1);
      const phi2 = toRad(lat2);
      const deltaLambda = toRad(lon2 - lon1);

      const y = Math.sin(deltaLambda) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) -
                Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radio de la Tierra en km
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    function updatePosition(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;

      targetBearing = calculateBearing(userLat, userLng, CUENCA_LAT, CUENCA_LNG);
      const distance = calculateDistance(userLat, userLng, CUENCA_LAT, CUENCA_LNG);

      const text = `Cuenca está a ${distance} km (Rumbo: ${Math.round(targetBearing)}°)`;
      distTextAr.textContent = text;
      distTextCompass.textContent = text;
    }

    function handleGeoError(err) {
      console.warn("Error GPS:", err);
    }

    // 3. PROCESAR ORIENTACIÓN DEL MÓVIL
    function handleOrientation(e) {
      // Detección de rumbo brújula
      let heading = 0;

      if (e.webkitCompassHeading) {
        // En iOS el valor es el acimut directo en grados respecto al Norte magnético
        heading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        // En Android estándar 'alpha' va en sentido antihorario
        heading = (360 - e.alpha) % 360;
      }

      // Si el botón de inversión está activo
      if (invertHeading) {
        heading = (heading + 180) % 360;
      }

      // Detección de inclinación: plano sobre la mano vs. alzado frente a los ojos
      const pitch = Math.abs(e.beta || 0);
      const isVertical = pitch > 45 && pitch < 135;

      if (isVertical) {
        // MODO CÁMARA / AR
        cameraVideo.style.display = 'block';
        arLayer.style.display = 'flex';
        compassLayer.style.display = 'none';

        // Desfase entre hacia dónde mira el usuario y Cuenca
        let diff = (targetBearing - heading + 540) % 360 - 180;

        // Si estamos a menos de 8 grados, ¡estás mirando a Cuenca!
        if (Math.abs(diff) <= 8) {
          reticle.classList.add('target-active');
          arHint.textContent = "¡ESTÁS MIRANDO A CUENCA!";
          arHint.style.color = "#00ff66";
          tapeMarker.style.color = "#00ff66";
        } else {
          reticle.classList.remove('target-active');
          arHint.textContent = diff > 0 ? "Gira a la DERECHA ➔" : "⬅ Gira a la IZQUIERDA";
          arHint.style.color = "#fff";
          tapeMarker.style.color = "#ff2244";
        }

        // Posición de la cinta superior (-45° a +45°)
        let clampedDiff = Math.max(-45, Math.min(45, diff));
        let percent = 50 + (clampedDiff / 45) * 50;
        tapeMarker.style.left = `${percent}%`;

      } else {
        // MODO PLANO SOBRE LA MANO (BRÚJULA TRADICIONAL)
        cameraVideo.style.display = 'none';
        arLayer.style.display = 'none';
        compassLayer.style.display = 'flex';

        // La aguja gira hacia el rumbo de Cuenca compensando el giro del teléfono
        let needleAngle = (targetBearing - heading + 360) % 360;
        needleSvg.style.transform = `rotate(${needleAngle}deg)`;
      }
    }
  </script>
</body>
</html>
