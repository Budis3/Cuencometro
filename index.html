<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mirando a Cuenca</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.85);
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* CAPA DE CÁMARA (FONDO COMPLETO EN MODO VERTICAL) */
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* PANTALLA DE INICIO / PERMISOS */
    #permission-modal {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #0b0f19 100%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.5rem 1.5rem;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .icon-cuenca {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .modal-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    /* CONTENEDOR PRINCIPAL DE LA APP */
    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    /* TOP BAR CON INFO Y SELECTOR */
    .top-bar {
      pointer-events: auto;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }
    .dot.active {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* MODO BRÚJULA (PLANO EN LA MANO) */
    #compass-mode {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      transition: opacity 0.3s;
    }

    .compass-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-bezel {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: radial-gradient(circle, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .compass-dial {
      position: absolute;
      width: 100%;
      height: 100%;
      transition: transform 0.1s ease-out;
    }

    .dial-mark {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .dial-mark.north {
      color: var(--danger);
      top: 8px;
      font-size: 1.1rem;
    }

    .dial-mark.east {
      top: 50%;
      right: 12px;
      left: auto;
      transform: translateY(-50%);
    }

    .dial-mark.south {
      top: auto;
      bottom: 10px;
      transform: translateX(-50%);
    }

    .dial-mark.west {
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
    }

    /* Aguja apuntando a Cuenca */
    .cuenca-needle {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.1s ease-out;
    }

    .needle-shape {
      width: 6px;
      height: 210px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .needle-cuenca-head {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 90px solid #ef4444;
      position: relative;
    }

    .needle-tail {
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 70px solid rgba(255, 255, 255, 0.2);
    }

    .needle-center-pin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      border: 3px solid #1e293b;
      z-index: 10;
    }

    .info-labels {
      margin-top: 2rem;
      text-align: center;
    }

    .target-city {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .target-distance {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* MODO REALIDAD AUMENTADA / CÁMARA (VERTICAL) */
    #ar-mode {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0;
      position: relative;
    }

    /* Cinta de rumbo superior */
    .ar-compass-bar {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.5rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ar-reticle-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Círculo estándar */
    .target-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--danger);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .target-circle.on-target {
      border-color: var(--success);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.8);
    }

    /* SVG de Casas Colgadas */
    .target-casas-svg {
      width: 180px;
      height: 180px;
      fill: none;
      stroke: var(--danger);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
      transition: stroke 0.15s, filter 0.15s;
    }

    .target-casas-svg.on-target {
      stroke: var(--success);
      filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.9));
    }

    .ar-status-text {
      margin-top: 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
    }

    /* BARRA INFERIOR DE DIAGNÓSTICO */
    .bottom-info {
      padding: 0.8rem 1rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- Elemento de Vídeo para la Cámara Trasera -->
  <video id="camera-video" playsinline autoplay muted></video>

  <!-- Modal de Permisos / Inicio -->
  <div id="permission-modal">
    <div class="modal-card">
      <div class="icon-cuenca">📍</div>
      <h1>Mirando a Cuenca</h1>
      <p>Coloca el móvil plano sobre la mano para usar la brújula, o levántalo para buscar Cuenca con la cámara.</p>
      <button class="btn-primary" id="start-btn">
        <span>Comenzar experiencia</span>
      </button>
    </div>
  </div>

  <!-- Contenedor de la Interfaz -->
  <div id="app-container">
    
    <!-- Barra Superior -->
    <div class="top-bar">
      <div class="badge-status">
        <div class="dot" id="target-dot"></div>
        <span id="target-status-label">Buscando...</span>
      </div>

      <button class="btn-icon" id="toggle-reticle-btn">
        <span id="reticle-mode-label">🏛️ Casas Colgadas</span>
      </button>
    </div>

    <!-- 1. MODO BRÚJULA (Móvil en horizontal / plano sobre la mano) -->
    <div id="compass-mode">
      <div class="compass-container">
        <div class="compass-bezel"></div>

        <!-- Roseta Cardinal que apunta al Norte -->
        <div class="compass-dial" id="compass-dial">
          <div class="dial-mark north">N</div>
          <div class="dial-mark east">E</div>
          <div class="dial-mark south">S</div>
          <div class="dial-mark west">O</div>
        </div>

        <!-- Aguja que apunta a Cuenca -->
        <div class="cuenca-needle" id="cuenca-needle">
          <div class="needle-shape">
            <div class="needle-cuenca-head" id="needle-head"></div>
            <div class="needle-tail"></div>
            <div class="needle-center-pin"></div>
          </div>
        </div>
      </div>

      <div class="info-labels">
        <div class="target-city">Cuenca</div>
        <div class="target-distance" id="distance-label">Calculando distancia...</div>
      </div>
    </div>

    <!-- 2. MODO CÁMARA (Móvil levantado frente a los ojos) -->
    <div id="ar-mode">
      <div class="ar-compass-bar" id="ar-bearing-bar">
        <span>📍 Cuenca: <strong id="ar-diff-angle">0°</strong></span>
      </div>

      <!-- Visor central: alternable entre círculo o SVG de las Casas Colgadas -->
      <div class="ar-reticle-container">
        <!-- Opción A: Círculo -->
        <div class="target-circle" id="circle-reticle"></div>

        <!-- Opción B: SVG Casas Colgadas -->
        <svg class="target-casas-svg" id="casas-reticle" viewBox="0 0 100 100" style="display: none;">
          <!-- Hoz y Risco -->
          <path d="M 5,95 Q 30,85 45,65 T 75,55 L 95,50" />
          <path d="M 45,65 L 45,95" />
          <path d="M 60,60 L 60,95" />
          <!-- Casas Colgadas -->
          <rect x="42" y="28" width="22" height="30" />
          <polygon points="40,28 53,18 66,28" />
          <!-- Balcones voladizos -->
          <rect x="37" y="38" width="5" height="12" />
          <line x1="37" y1="50" x2="42" y2="50" />
          <line x1="37" y1="44" x2="37" y2="48" />
          <rect x="36" y="52" width="6" height="8" />
          <!-- Ventanas -->
          <line x1="48" y1="36" x2="52" y2="36" />
          <line x1="56" y1="36" x2="60" y2="36" />
          <line x1="48" y1="46" x2="52" y2="46" />
          <line x1="56" y1="46" x2="60" y2="46" />
        </svg>

        <div class="ar-status-text" id="ar-guidance-text">Gira hacia Cuenca</div>
      </div>

      <div style="height: 40px;"></div>
    </div>

    <!-- Barra inferior con datos de comprobación -->
    <div class="bottom-info">
      <div>Rumbo Móvil: <span id="debug-heading">--°</span></div>
      <div>Rumbo a Cuenca: <span id="debug-cuenca">--°</span></div>
      <div>Desvío: <span id="debug-diff">--°</span></div>
    </div>

  </div>

  <script>
    // Coordenadas oficiales de las Casas Colgadas de Cuenca
    const CUENCA_LAT = 40.07833;
    const CUENCA_LON = -2.12889;

    let userLat = null;
    let userLon = null;
    let bearingToCuenca = 0;
    let distanceKm = 0;

    let currentHeading = 0;
    let isVertical = false;
    let reticleMode = 'circle'; // 'circle' o 'casas'

    const TOLERANCE_DEG = 9; // Margen de acierto en grados

    // Elementos DOM
    const modal = document.getElementById('permission-modal');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('camera-video');
    const compassMode = document.getElementById('compass-mode');
    const arMode = document.getElementById('ar-mode');
    const compassDial = document.getElementById('compass-dial');
    const cuencaNeedle = document.getElementById('cuenca-needle');
    const needleHead = document.getElementById('needle-head');
    const distanceLabel = document.getElementById('distance-label');
    const targetDot = document.getElementById('target-dot');
    const targetStatusLabel = document.getElementById('target-status-label');
    const toggleReticleBtn = document.getElementById('toggle-reticle-btn');
    const reticleModeLabel = document.getElementById('reticle-mode-label');
    const circleReticle = document.getElementById('circle-reticle');
    const casasReticle = document.getElementById('casas-reticle');
    const arDiffAngle = document.getElementById('ar-diff-angle');
    const arGuidanceText = document.getElementById('ar-guidance-text');
    const debugHeading = document.getElementById('debug-heading');
    const debugCuenca = document.getElementById('debug-cuenca');
    const debugDiff = document.getElementById('debug-diff');

    // FÓRMULA DE RUMBO DIRECTO (Círculo Máximo / Orto-drómica)
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);

      return (θ * 180 / Math.PI + 360) % 360;
    }

    // CÁLCULO DE DISTANCIA (Haversine)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Radio de la Tierra en km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // INICIAR CÁMARA TRASERA
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.play();
      } catch (err) {
        console.warn("No se pudo iniciar la cámara trasera:", err);
      }
    }

    // GESTIÓN DE ORIENTACIÓN Y GIROSCOPIO
    function handleOrientation(e) {
      let heading = null;

      // 1. iOS Safari (webkitCompassHeading nos da el Norte en grados directos)
      if (typeof e.webkitCompassHeading !== "undefined") {
        heading = e.webkitCompassHeading;
      } 
      // 2. Android estándar (deviceorientationabsolute o deviceorientation)
      else if (e.alpha !== null) {
        heading = (360 - e.alpha) % 360;
      }

      if (heading === null) return;
      currentHeading = heading;

      // Detección de postura: Plano sobre la mano vs. Vertical frente a los ojos
      // beta: ~0° cuando está plano boca arriba, ~90° cuando está levantado
      const beta = Math.abs(e.beta || 0);
      const wasVertical = isVertical;
      isVertical = beta > 45;

      if (isVertical !== wasVertical) {
        if (isVertical) {
          compassMode.style.display = "none";
          arMode.style.display = "flex";
          video.style.display = "block";
        } else {
          arMode.style.display = "none";
          compassMode.style.display = "flex";
          video.style.display = "none";
        }
      }

      actualizarBrujulaYVisor();
    }

    function actualizarBrujulaYVisor() {
      // 1. Roseta cardinal: gira en sentido opuesto para que la N mire siempre al Norte
      compassDial.style.transform = `rotate(${-currentHeading}deg)`;

      // 2. Aguja a Cuenca: la diferencia entre el rumbo a Cuenca y hacia dónde mira el móvil
      const needleAngle = (bearingToCuenca - currentHeading + 360) % 360;
      cuencaNeedle.style.transform = `rotate(${needleAngle}deg)`;

      // 3. Diferencia angular normalizada (-180° a +180°)
      let diff = (bearingToCuenca - currentHeading + 540) % 360 - 180;
      const isLookingAtCuenca = Math.abs(diff) <= TOLERANCE_DEG;

      // Actualizar información en AR
      arDiffAngle.textContent = `${Math.abs(Math.round(diff))}° ${diff > 0 ? 'a la der.' : 'a la izq.'}`;

      // Actualizar estados visuales (Rojo / Verde)
      if (isLookingAtCuenca) {
        circleReticle.classList.add('on-target');
        casasReticle.classList.add('on-target');
        needleHead.style.borderBottomColor = "#10b981";
        targetDot.classList.add('active');
        targetStatusLabel.textContent = "¡Mirando a Cuenca!";
        arGuidanceText.textContent = "🎯 ¡Estás mirando a Cuenca!";
      } else {
        circleReticle.classList.remove('on-target');
        casasReticle.classList.remove('on-target');
        needleHead.style.borderBottomColor = "#ef4444";
        targetDot.classList.remove('active');
        targetStatusLabel.textContent = "Buscando Cuenca";
        arGuidanceText.textContent = diff > 0 ? "Gira a la derecha ➡️" : "⬅️ Gira a la izquierda";
      }

      // Panel de depuración inferior
      debugHeading.textContent = `${Math.round(currentHeading)}°`;
      debugCuenca.textContent = `${Math.round(bearingToCuenca)}°`;
      debugDiff.textContent = `${Math.round(diff)}°`;
    }

    // GEOLOCALIZACIÓN GPS
    function initGPS() {
      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;

          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);

          distanceLabel.textContent = `A ${Math.round(distanceKm)} km en línea recta`;
          actualizarBrujulaYVisor();
        },
        (err) => {
          console.warn("Error en GPS:", err);
          // Si deniegan o falla el GPS, se usa Madrid por defecto para pruebas
          userLat = 40.4168;
          userLon = -3.7038;
          bearingToCuenca = calculateBearing(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceKm = calculateDistance(userLat, userLon, CUENCA_LAT, CUENCA_LON);
          distanceLabel.textContent = `Aprox. ${Math.round(distanceKm)} km (Modo estimado)`;
          actualizarBrujulaYVisor();
        },
        { enableHighAccuracy: true, maximumAge: 10000 }
      );
    }

    // BOTÓN DE INICIO: PEDIR PERMISOS
    startBtn.addEventListener('click', async () => {
      // 1. Iniciar GPS y Cámara
      initGPS();
      await startCamera();

      // 2. Permisos de Sensores en iOS 13+
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          } else {
            alert('Se requiere el permiso de orientación para la brújula.');
          }
        } catch (err) {
          console.error(err);
        }
      } else {
        // En Android escuchamos preferentemente el evento absoluto
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }

      // Ocultar modal de inicio
      modal.style.display = 'none';
    });

    // ALTERNAR ENTRE CÍRCULO Y CASAS COLGADAS SVG
    toggleReticleBtn.addEventListener('click', () => {
      if (reticleMode === 'circle') {
        reticleMode = 'casas';
        circleReticle.style.display = 'none';
        casasReticle.style.display = 'block';
        reticleModeLabel.textContent = "⭕ Círculo";
      } else {
        reticleMode = 'circle';
        casasReticle.style.display = 'none';
        circleReticle.style.display = 'block';
        reticleModeLabel.textContent = "🏛️ Casas Colgadas";
      }
    });
  </script>
</body>
</html>
